    <!-- Invisible SVG filters for liquid glass refraction & distortion -->
    <svg id="glass-filters" aria-hidden="true" focusable="false"
         style="position:absolute;width:0;height:0;overflow:hidden;pointer-events:none">
      <defs>
        <!-- Liquid distortion: turbulence + displacement for background warping -->
        <filter id="liquid-glass-distort" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
          <feTurbulence type="fractalNoise" baseFrequency="0.018 0.032" numOctaves="3" seed="3" result="turbulence"/>
          <feDisplacementMap in="SourceGraphic" in2="turbulence" scale="5" xChannelSelector="R" yChannelSelector="G" result="displaced"/>
          <feGaussianBlur in="displaced" stdDeviation="0.4" result="softened"/>
          <feComposite in="softened" in2="SourceGraphic" operator="over"/>
        </filter>
        <!-- Frosted edge blur for soft glass boundaries -->
        <filter id="glass-edge-blur" x="-5%" y="-5%" width="110%" height="110%">
          <feGaussianBlur stdDeviation="1.2" result="blur"/>
          <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
        <!-- Chromatic aberration split for prismatic card edges -->
        <filter id="glass-chromatic" x="-2%" y="-2%" width="104%" height="104%" color-interpolation-filters="sRGB">
          <feOffset in="SourceGraphic" dx="1.5" dy="0" result="red-shift"/>
          <feOffset in="SourceGraphic" dx="-1.5" dy="0" result="blue-shift"/>
          <feBlend in="red-shift" in2="blue-shift" mode="screen" result="chromatic"/>
          <feComposite in="SourceGraphic" in2="chromatic" operator="over"/>
        </filter>
      </defs>
    </svg>
    <div id="root"></div>
